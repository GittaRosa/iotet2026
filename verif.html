<title>Vérification de certificat – IoT & ET 2026</title>
<style>
:root{--navy:#0b2a6b;--blue:#1f6fd1;--ok:#14804a;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Cambria,Georgia,"Times New Roman",serif;color:var(--navy);
background:linear-gradient(160deg,#e9f2ff 0%,#fff 45%,#dcebff 100%);display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:760px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 20px 8px}
header img{height:84px;width:auto}
main{width:100%;max-width:760px;padding:12px 20px 40px}
.card{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(11,42,107,.12);padding:36px 28px;text-align:center}
.badge{width:76px;height:76px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-family:Arial,sans-serif}
.ok .badge{background:var(--ok)}.bad .badge{background:var(--bad)}
.status{font-family:Calibri,Arial,sans-serif;font-size:14px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.ok .status{color:var(--ok)}.bad .status{color:var(--bad)}
.name{font-size:clamp(28px,6vw,42px);font-weight:700;margin:14px 0 6px;overflow-wrap:anywhere}
.msg{font-size:18px;line-height:1.55;margin:10px auto 0;max-width:560px}
.msg b{color:var(--blue)}
.en{font-size:15px;font-style:italic;opacity:.8;margin-top:14px}
.info{margin:26px auto 0;padding-top:20px;border-top:1px solid #d6e2f5;font-family:Calibri,Arial,sans-serif;font-size:15px;line-height:1.6}
a.btn{display:inline-block;margin-top:18px;background:var(--navy);color:#fff;text-decoration:none;padding:11px 22px;border-radius:999px;font-family:Calibri,Arial,sans-serif;font-size:15px}
footer{font-family:Calibri,Arial,sans-serif;font-size:12px;opacity:.65;padding:0 20px 24px;text-align:center}
</style>
